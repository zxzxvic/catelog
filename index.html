<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Day Mode (Light) */
            --bg-primary: #fafafa;
            --bg-card: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --accent: #1a1a1a;
            --accent-light: #f0f0f0;
            --border: #e5e5e5;
            --shadow: 0 4px 20px rgba(0,0,0,0.06);
            --shadow-hover: 0 8px 30px rgba(0,0,0,0.1);
            --card-radius: 16px;
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            /* Night Mode (Dark) */
            --bg-primary: #0a0a0f;
            --bg-card: #12121a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent: #00f5d4;
            --accent-light: #1a1a2e;
            --border: #1f1f2e;
            --shadow: 0 4px 20px rgba(0,0,0,0.4);
            --shadow-hover: 0 8px 40px rgba(0,245,212,0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: var(--transition);
            overflow-x: hidden;
        }

        /* ===== TOPBAR ===== */
        .topbar {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
            z-index: 100;
        }

        .lang-btn,
        .theme-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: var(--transition);
            color: var(--text-secondary);
        }

        .lang-btn:hover,
        .theme-btn:hover,
        .lang-btn.active {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        /* ===== HEADER ===== */
        .header {
            padding: 80px 24px 60px;
            text-align: center;
            position: relative;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 600px;
            height: 300px;
            background: radial-gradient(ellipse at center, var(--accent) 0%, transparent 70%);
            opacity: 0.06;
            pointer-events: none;
        }

        .logo {
            font-size: clamp(48px, 10vw, 72px);
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .announcement {
            max-width: 600px;
            margin: 0 auto 0;
            padding: 12px 20px;
            background: var(--accent-light);
            border: 1px solid var(--border);
            border-radius: 12px;
            text-align: center;
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        [data-theme="dark"] .logo {
            background: linear-gradient(135deg, #ffffff 0%, #00f5d4 100%);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .tagline {
            font-size: 18px;
            color: var(--text-secondary);
            font-weight: 400;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* ===== CONTAINER ===== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px 80px;
        }

        /* ===== CATEGORY SECTION ===== */
        .category {
            margin-bottom: 60px;
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .category-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--accent-light);
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 24px;
            flex-shrink: 0;
        }

        [data-theme="dark"] .category-icon {
            background: linear-gradient(135deg, rgba(0,245,212,0.1) 0%, rgba(0,245,212,0.05) 100%);
            border-color: rgba(0,245,212,0.2);
        }

        .category-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            flex-shrink: 0;
        }

        /* ===== CARD GRID ===== */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        /* ===== CARDS ===== */
        .card {
            position: relative;
            height: 220px;
            border-radius: var(--card-radius);
            overflow: hidden;
            cursor: pointer;
            text-decoration: none;
            display: block;
            transition: var(--transition);
            box-shadow: var(--shadow);
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
        }

        .card-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            transition: var(--transition);
        }

        .card:hover .card-bg {
            transform: scale(1.05);
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                180deg,
                rgba(0,0,0,0.1) 0%,
                rgba(0,0,0,0.7) 100%
            );
            z-index: 1;
        }

        .card-content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 2;
            color: white;
        }

        .card-title {
            font-size: 22px;
            font-weight: 700;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
            text-align: center;
        }

        .card-password {
            font-size: 14px;
            color: rgba(255,255,255,0.9);
            margin-top: 6px;
            font-weight: 600;
            letter-spacing: 3px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.4);
            text-align: center;
        }

        .card-hover-hint {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.25s ease;
            z-index: 3;
        }

        .card:hover .card-hover-hint {
            opacity: 1;
        }

        .card-hover-hint .hint-password {
            font-size: 36px;
            font-weight: 800;
            color: white;
            letter-spacing: 6px;
            text-shadow: 0 2px 12px rgba(0,0,0,0.5);
        }

        /* ===== CONTACT FOOTER ===== */
        .contact {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--card-radius);
            padding: 40px;
            margin-top: 60px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .contact-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--text-primary);
        }

        .contact-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
        }

        .contact-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: var(--accent-light);
            border: 1px solid var(--border);
            border-radius: 50px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
        }

        .contact-link:hover {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        .contact-link .icon {
            font-size: 16px;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: var(--text-primary);
            color: var(--bg-primary);
            padding: 20px 36px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            pointer-events: none;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            padding: 40px 24px;
            color: var(--text-secondary);
            font-size: 13px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .header {
                padding: 60px 20px 40px;
            }

            .container {
                padding: 0 16px 60px;
            }

            .card-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .contact {
                padding: 30px 20px;
            }

            .contact-links {
                flex-direction: column;
            }

            .topbar {
                top: 12px;
                right: 12px;
            }

            .lang-btn,
            .theme-btn {
                width: 36px;
                height: 36px;
                font-size: 14px;
            }
        }
    </style>
</head>

        // ===== THEME MANAGEMENT =====
        function getAutoTheme() {
            const hour = new Date().getHours();
            return (hour >= 6 && hour < 18) ? 'light' : 'dark';
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            const icon = document.getElementById('modeIcon');

            if (theme === 'dark') {
                icon.textContent = '🌙';
            } else if (theme === 'light') {
                icon.textContent = '☀️';
            } else {
                icon.textContent = '🌀';
            }
        }

        function initTheme() {
            const saved = localStorage.getItem('theme');
            if (saved === 'auto' || !saved) {
                const visualTheme = getAutoTheme();
                document.documentElement.setAttribute('data-theme', visualTheme);
                document.getElementById('modeIcon').textContent = '🌀';
                localStorage.setItem('theme', 'auto');
            } else {
                applyTheme(saved);
            }
        }

        function toggleTheme() {
            const current = localStorage.getItem('theme') || 'auto';
            let next;
            if (current === 'auto') {
                next = 'light';
            } else if (current === 'light') {
                next = 'dark';
            } else {
                next = 'auto';
            }
            localStorage.setItem('theme', next);
            if (next === 'auto') {
                applyTheme(getAutoTheme());
            } else {
                applyTheme(next);
            }
        }

        // ===== LANGUAGE MANAGEMENT =====
        let lang = 'en';

        function detectLang() {
            const saved = localStorage.getItem('lang');
            if (saved && saved !== 'auto') return saved;
            const browser = navigator.language.toLowerCase();
            if (browser.startsWith('zh')) return 'zh';
            if (browser.startsWith('pt')) return 'pt';
            return 'en';
        }

        function applyLang(l) {
            lang = l;
            document.documentElement.lang = l;

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                if (T[l] && T[l][key]) {
                    el.textContent = T[l][key];
                }
            });

            document.querySelectorAll('[data-i18n-pwd]').forEach(el => {
                const key = el.dataset.i18nPwd;
                if (T[l] && T[l][key]) {
                    el.textContent = T[l][key];
                }
            });

            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`.lang-btn[onclick="setLang('${l}')"]`)?.classList.add('active');

            const theme = localStorage.getItem('theme') || 'auto';
            if (theme !== 'auto') applyTheme(theme);
        }

        function setLang(newLang) {
            localStorage.setItem('lang', newLang);
            applyLang(newLang === 'auto' ? detectLang() : newLang);
        }

        // ===== COPY FUNCTIONALITY =====
        function showToast() {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toastText');
            toastText.textContent = T[lang]['toast.copied'];
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        document.querySelectorAll('a[data-pwd]').forEach(link => {
            link.addEventListener('click', async (e) => {
                e.preventDefault();
                const pwd = link.dataset.pwd;
                const url = link.href;

                try {
                    await navigator.clipboard.writeText(pwd);
                } catch {
                    const ta = document.createElement('textarea');
                    ta.value = pwd;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                }

                showToast();
                window.open(url, '_blank');
            });
        });

        // ===== INIT =====
        document.addEventListener('DOMContentLoaded', () => {
            lang = detectLang();
            initTheme();
            applyLang(lang);

            setInterval(() => {
                if (localStorage.getItem('theme') === 'auto') {
                    applyTheme(getAutoTheme());
                }
            }, 60000);
        });
    </script>
